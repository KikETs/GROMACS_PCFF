name: Exact OpenMP Report Guard

on:
  push:
    paths:
      - ".github/workflows/exact_openmp_report_guard.yml"
      - "docs/exact_respa_cpu_claim_boundary.md"
      - "tools/freeze_cpu_exact_respa_claim/**"
      - "tools/exact_respa_openmp_validation/**"
      - "tests/reference_schema/test_cpu_exact_respa_claim_schema.py"
      - "tests/reference_schema/test_exact_openmp_host_local_explicit_counts_schema.py"
      - "tests/reference_results/cpu_exact_respa_claim/**"
      - "tests/reference_results/exact_respa_openmp_validation/**"
  pull_request:
    paths:
      - ".github/workflows/exact_openmp_report_guard.yml"
      - "docs/exact_respa_cpu_claim_boundary.md"
      - "tools/freeze_cpu_exact_respa_claim/**"
      - "tools/exact_respa_openmp_validation/**"
      - "tests/reference_schema/test_cpu_exact_respa_claim_schema.py"
      - "tests/reference_schema/test_exact_openmp_host_local_explicit_counts_schema.py"
      - "tests/reference_results/cpu_exact_respa_claim/**"
      - "tests/reference_results/exact_respa_openmp_validation/**"
  workflow_dispatch:

jobs:
  validate-checked-in-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Validate checked-in exact OpenMP reports
        run: |
          python3 tools/exact_respa_openmp_validation/validate_checked_in_reports.py \
            --strict

      - name: Regenerate frozen CPU exact claim artifacts
        run: |
          python3 tools/freeze_cpu_exact_respa_claim/generate.py
          git diff --exit-code -- tests/reference_results/cpu_exact_respa_claim

      - name: Validate frozen CPU exact claim schema and boundary doc
        run: |
          python3 -m pytest \
            tests/reference_schema/test_cpu_exact_respa_claim_schema.py \
            tests/reference_schema/test_exact_openmp_host_local_explicit_counts_schema.py
